name: Update World Cup 2026 Results

on:
  schedule:
    # Every 20 minutes from 11:00 UTC to 04:00 UTC (covers all match windows)
    - cron: '*/20 11-23 11 6 *'   # June 11
    - cron: '*/20 0-4  12 6 *'
    - cron: '*/20 11-23 12-27 6 *' # June 12-27 group stage
    - cron: '*/20 0-4  13-28 6 *'
    - cron: '*/20 11-23 28-30 6 *' # June 28-30 R32
    - cron: '*/20 0-4  29-30 6 *'
    - cron: '*/20 11-23 1-19 7 *'  # July 1-19 knockouts + final
    - cron: '*/20 0-4  2-20 7 *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/world-cup-progress-chart-2tPSj

      - name: Fetch results from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          API_KEY = os.environ.get('FOOTBALL_DATA_API_KEY', '')
          RESULTS_PATH = 'worldcup2026/data/results.json'

          # Load existing results
          try:
              with open(RESULTS_PATH) as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {'lastUpdated': '', 'matches': {}}

          if not API_KEY:
              print('No FOOTBALL_DATA_API_KEY secret set — skipping API call.')
              sys.exit(0)

          # football-data.org v4 — FIFA World Cup 2026 competition code: WC
          url = 'https://api.football-data.org/v4/competitions/WC/matches'
          req = urllib.request.Request(url, headers={'X-Auth-Token': API_KEY})

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  api_data = json.loads(resp.read())
          except urllib.error.URLError as e:
              print(f'API fetch failed: {e}')
              sys.exit(1)

          STATUS_MAP = {
              'SCHEDULED': 'upcoming',
              'TIMED':     'upcoming',
              'IN_PLAY':   'live',
              'PAUSED':    'live',
              'FINISHED':  'finished',
              'AWARDED':   'finished',
              'CANCELLED': 'cancelled',
              'POSTPONED': 'upcoming',
          }

          updated = False
          for m in api_data.get('matches', []):
              mid = str(m.get('id'))
              status = STATUS_MAP.get(m.get('status', ''), 'upcoming')
              score = m.get('score', {})
              full = score.get('fullTime', {})
              s1 = full.get('home')
              s2 = full.get('away')

              entry = data['matches'].get(mid, {})
              new_entry = {'score1': s1, 'score2': s2, 'status': status}

              if entry != new_entry:
                  data['matches'][mid] = new_entry
                  updated = True

          if updated:
              data['lastUpdated'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              with open(RESULTS_PATH, 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'Results updated: {RESULTS_PATH}')
          else:
              print('No changes to results.')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worldcup2026/data/results.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update World Cup 2026 results [skip ci]"
            git push origin claude/world-cup-progress-chart-2tPSj
          fi
